openapi: 3.0.3
info:
  title: PC Control
  version: "1"
  description: |
    REST API of the PC Control tray app. Live input uses the WebSocket channel in websocket.md.
    Authentication is the `pc_device` cookie or an `Authorization: Bearer` token (see pairing.md).
servers:
  - url: http://{host}:48123
    variables:
      host:
        default: 192.168.1.10
paths:
  /api/info:
    get:
      summary: Identify the PC app (public)
      security: []
      responses:
        "200":
          description: Always available on the home network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /api/pair:
    post:
      summary: Exchange a PIN for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Paired. A cookie is set; the body has `token` only when `issueBearerToken` was true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Wrong, expired or missing PIN (`error` = `invalid_pin`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not on the home network, bad Host header, or foreign Origin.
        "429":
          description: Too many failed attempts (`error` = `locked_out`).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until pairing is allowed again.
  /api/session:
    get:
      summary: The calling device
      responses:
        "200":
          description: The paired device behind the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Missing, unknown or revoked token.
    delete:
      summary: Forget this device (revoke its own token)
      responses:
        "204":
          description: Removed. The cookie is cleared.
        "401":
          description: Missing, unknown or revoked token.
  /api/capabilities:
    get:
      summary: Which features this PC offers right now
      description: A feature is `true` only if it exists in this build and its config toggle is on.
      responses:
        "200":
          description: Feature name to availability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                example:
                  trackpad: false
                  keyboard: false
                  power: false
        "401":
          description: Missing, unknown or revoked token.
  /api/dpi:
    get:
      summary: The display scale the toggle controls
      description: |
        Reads the scale fresh each time. `available` is false when the startup self-test failed (for
        example after a Windows update changed the undocumented calls the toggle relies on); `reason`
        then says why. The target monitor is chosen by `dpi.monitor` in the PC's config (default: the
        primary monitor).
      responses:
        "200":
          description: The scale and what the toggle switches between.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiStatus"
        "401":
          description: Missing, unknown or revoked token.
  /api/dpi/toggle:
    post:
      summary: Switch the display scale between its low and high value
      description: |
        Changes the target monitor from the low scale (default 100%) to the high one (default 200%), or
        from anything else back to the low one. The response is sent only after Windows reports the
        new scale. Some apps stay blurry until restarted. Calls while a change is running get 409
        instead of undoing it.
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiChange"
        "401":
          description: Missing, unknown or revoked token.
        "409":
          description: A change is already in progress (`busy`).
        "422":
          description: The monitor does not allow the target scale (`scale_not_supported`). `message` says what its largest scale is.
        "502":
          description: Windows accepted the request but the scale did not change (`dpi_failed`).
        "503":
          description: The toggle is turned off, for example because the self-test failed (`dpi_unavailable`).
  /api/monitors:
    get:
      summary: The PC's monitors, left to right
      description: Needs the `screenshot` feature toggle. The `index` is what the previews and the screenshot take as `monitor`.
      responses:
        "200":
          description: The monitors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Monitor"
        "401":
          description: Missing, unknown or revoked token.
        "403":
          description: The screenshot feature is switched off (`feature_disabled`).
  /api/screenshot:
    get:
      summary: A picture of one monitor, on demand
      description: |
        A JPEG of the whole monitor. It contains no mouse cursor; `X-Cursor-X` and `X-Cursor-Y` give
        the cursor's position inside the picture (-1 when it is on another monitor) so the client can
        draw a marker. Needs the `screenshot` feature toggle.
      parameters:
        - name: monitor
          in: query
          schema:
            type: integer
            default: -1
          description: Monitor index, or -1 for the monitor the cursor is on.
        - name: width
          in: query
          schema:
            type: integer
            default: 720
            minimum: 160
            maximum: 1920
          description: Width in pixels; the picture is never enlarged beyond the monitor.
      responses:
        "200":
          description: The picture.
          headers:
            X-Cursor-X:
              schema:
                type: integer
            X-Cursor-Y:
              schema:
                type: integer
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          description: Missing, unknown or revoked token.
        "403":
          description: The screenshot feature is switched off (`feature_disabled`).
        "503":
          description: The screen cannot be read, for example because the PC is locked (`screen_unavailable`).
security:
  - deviceCookie: []
  - bearer: []
components:
  securitySchemes:
    deviceCookie:
      type: apiKey
      in: cookie
      name: pc_device
    bearer:
      type: http
      scheme: bearer
  schemas:
    DpiStatus:
      type: object
      required: [available, lowPercent, highPercent]
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Why the toggle is off, when it is.
        percent:
          type: integer
          nullable: true
          description: The monitor's current scale.
        lowPercent:
          type: integer
          example: 100
        highPercent:
          type: integer
          example: 200
        monitor:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            name:
              type: string
        backend:
          type: string
          nullable: true
          description: Which method read the scale (display-config, effective-dpi or script).
    DpiChange:
      type: object
      required: [previous, percent, note]
      properties:
        previous:
          type: integer
        percent:
          type: integer
        monitor:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            name:
              type: string
        note:
          type: string
          example: Some apps stay blurry until they are restarted.
    Monitor:
      type: object
      required: [index, name, x, y, width, height, primary]
      properties:
        index:
          type: integer
        name:
          type: string
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        primary:
          type: boolean
    Info:
      type: object
      required: [app, protocolVersion, paused]
      properties:
        app:
          type: string
          example: pc-control
        protocolVersion:
          type: integer
          example: 1
        paused:
          type: boolean
          description: True while the tray kill switch is on.
    PairRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{6}$"
        deviceName:
          type: string
          maxLength: 64
          description: Shown in the tray's device list. Defaults to "Phone".
        issueBearerToken:
          type: boolean
          default: false
          description: Native apps set this to receive the token in the response body.
    Session:
      type: object
      required: [deviceId, deviceName, paused]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        paused:
          type: boolean
        token:
          type: string
          description: Only present in the pairing response, and only when requested.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
