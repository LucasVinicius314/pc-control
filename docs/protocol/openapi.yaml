openapi: 3.0.3
info:
  title: PC Control
  version: "1"
  description: |
    REST API of the PC Control tray app. Live input uses the WebSocket channel in websocket.md.
    Authentication is the `pc_device` cookie or an `Authorization: Bearer` token (see pairing.md).
servers:
  - url: http://{host}:48123
    variables:
      host:
        default: 192.168.1.10
paths:
  /api/info:
    get:
      summary: Identify the PC app (public)
      security: []
      responses:
        "200":
          description: Always available on the home network.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Info"
  /api/pair:
    post:
      summary: Exchange a PIN for a device token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PairRequest"
      responses:
        "200":
          description: Paired. A cookie is set; the body has `token` only when `issueBearerToken` was true.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Wrong, expired or missing PIN (`error` = `invalid_pin`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not on the home network, bad Host header, or foreign Origin.
        "429":
          description: Too many failed attempts (`error` = `locked_out`).
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until pairing is allowed again.
  /api/session:
    get:
      summary: The calling device
      responses:
        "200":
          description: The paired device behind the token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "401":
          description: Missing, unknown or revoked token.
    delete:
      summary: Forget this device (revoke its own token)
      responses:
        "204":
          description: Removed. The cookie is cleared.
        "401":
          description: Missing, unknown or revoked token.
  /api/capabilities:
    get:
      summary: Which features this PC offers right now
      description: A feature is `true` only if it exists in this build and its config toggle is on.
      responses:
        "200":
          description: Feature name to availability.
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: boolean
                example:
                  trackpad: false
                  keyboard: false
                  power: false
        "401":
          description: Missing, unknown or revoked token.
  /api/apps:
    get:
      summary: The Start menu, with favorites and recently used apps
      description: |
        Reads the Start menu again each time (newly installed apps show up). Apps are identified by an
        opaque `id` (a hash); the phone never sees or sends the command Windows uses to start them.
        The list is alphabetical, ignoring case and accents.
      responses:
        "200":
          description: Every app, the recently launched ones, and the PowerToys Run shortcut.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AppList"
        "401":
          description: Missing, unknown or revoked token.
  /api/apps/{id}/icon:
    get:
      summary: An app's icon as a PNG
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: A 64 pixel PNG with transparency. Cacheable for an hour.
          content:
            image/png:
              schema:
                type: string
                format: binary
        "404":
          description: Unknown app, or it has no icon (`no_icon`). Show a placeholder.
  /api/apps/{id}/launch:
    post:
      summary: Start an app on the PC
      description: |
        Only apps from the list can be started, by their `id`. Refused while the tray's kill switch is
        on. The launch is logged with the device name.
      parameters:
        - $ref: "#/components/parameters/AppId"
      responses:
        "200":
          description: Windows accepted the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  launched:
                    type: boolean
                  name:
                    type: string
        "404":
          description: Not an app in the Start menu (`unknown_app`).
        "409":
          description: The kill switch is on (`paused`).
        "502":
          description: Windows could not start it (`launch_failed`).
  /api/apps/{id}/favorite:
    put:
      summary: Mark or unmark a favorite
      parameters:
        - $ref: "#/components/parameters/AppId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [favorite]
              properties:
                favorite:
                  type: boolean
      responses:
        "204":
          description: Saved. Works while the kill switch is on, because it changes nothing on the PC.
        "400":
          description: "`favorite` missing or not a boolean (`invalid_message`)."
        "404":
          description: Unknown app (`unknown_app`).
  /api/powertoys-run:
    post:
      summary: Press the shortcut that opens PowerToys Run
      description: |
        Presses the key combination on the PC. With the default setting (`launcher.powerToysRunShortcut`
        is `auto`) it is read from PowerToys' own settings each time, so it follows what the user chose in
        PowerToys, falling back to Alt+Space if PowerToys is not found. Afterwards the phone's keyboard
        types into PowerToys Run. Refused while the kill switch is on.
      responses:
        "204":
          description: The shortcut was pressed.
        "409":
          description: The kill switch is on (`paused`).
  /api/url:
    post:
      summary: Open a web address in the PC's default browser
      description: |
        Only http and https addresses. "example.com/x" is read as https. Anything else (file:, javascript:,
        ms-settings:, programs, addresses with spaces or a user name) is refused with `invalid_url`.
        Refused while the kill switch is on. Needs the `sendUrl` capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url:
                  type: string
                  maxLength: 2048
      responses:
        "200":
          description: Opened. Returns `{ opened: true, url }` with the cleaned-up address.
        "400":
          description: Not a web address (`invalid_url`).
        "403":
          description: Switched off in the PC's config (`feature_disabled`).
        "409":
          description: The kill switch is on (`paused`).
        "502":
          description: Windows could not open it (`open_failed`).
  /api/power:
    get:
      summary: A restart or shutdown that is counting down
      responses:
        "200":
          description: "`{ pending: null }` or `{ pending: { action, secondsLeft } }`."
    post:
      summary: Lock, sleep, restart, shut down or sign out
      description: |
        `action` is `lock`, `sleep`, `restart`, `shutdown` or `signOut`. `restart`, `shutdown` and
        `signOut` also need `"confirm": true`, otherwise `confirmation_required`. Restart and shutdown
        count down 15 seconds first (`delaySeconds`) so a wrong tap can be cancelled. Refused while the
        kill switch is on. Needs the `power` capability.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  type: string
                  enum: [lock, sleep, restart, shutdown, signOut]
                confirm:
                  type: boolean
      responses:
        "200":
          description: Started. Returns `{ action, delaySeconds }`.
        "400":
          description: "`unknown_action` or `confirmation_required`."
        "403":
          description: Switched off in the PC's config (`feature_disabled`).
        "409":
          description: The kill switch is on (`paused`).
        "502":
          description: Windows refused (`power_failed`).
  /api/power/pending:
    delete:
      summary: Cancel a restart or shutdown that is counting down
      description: Still allowed while the kill switch is on, because it only makes the PC safer.
      responses:
        "204":
          description: Cancelled.
        "404":
          description: Nothing was counting down (`nothing_pending`).
  /api/processes:
    get:
      summary: Programs that have a window
      description: |
        The signed-in user's programs with a visible window, by title. Windows system processes and
        this app are never listed. Ids are opaque and only valid for the latest list; process numbers
        are never sent. Needs the `processKiller` capability.
      responses:
        "200":
          description: "A list of `{ id, name, title, minimized }`."
        "403":
          description: Switched off in the PC's config (`feature_disabled`).
  /api/processes/{id}/preview:
    get:
      summary: A picture of a program's window
      description: |
        A JPEG of the window of a program from the latest list, like the thumbnails in Alt+Tab. `width`
        (160 to 960, default 480) is the largest width wanted. The picture is drawn by the window itself, so
        it does not matter what is on top of it. Pictures are kept for a few seconds on the PC. Needs the
        `processKiller` capability, and is refused while the kill switch is on because it shows the screen.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: width
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: A JPEG, not cached.
        "404":
          description: "`unknown_process`, or `no_image` when there is nothing to show (a minimised window, or one that cannot be drawn this way)."
        "409":
          description: The kill switch is on (`paused`).
  /api/processes/{id}/close:
    post:
      summary: Close a program from the latest list
      description: |
        Without `force` the program is asked to close its window (it may still ask to save). With
        `"force": true` it is ended at once. An id that is not in the latest list is `unknown_process`.
        Refused while the kill switch is on.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                force:
                  type: boolean
      responses:
        "200":
          description: Done. Returns `{ closed: true, title }`.
        "404":
          description: "`unknown_process` or `process_gone`."
        "409":
          description: The kill switch is on (`paused`).
        "502":
          description: The program did not close (`close_failed`).
  /api/processes/{id}/focus:
    post:
      summary: Bring a program from the latest list to the front
      description: Like Alt+Tab; a minimised window is restored. Same id rules and kill-switch behaviour as close.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Done. Returns `{ focused: true, title }`.
        "404":
          description: "`unknown_process` or `process_gone`."
        "409":
          description: The kill switch is on (`paused`).
        "502":
          description: Windows would not do it (`focus_failed`).
  /api/couch/controllers:
    get:
      summary: The controllers that are connected to the PC
      description: |
        For the controller UI's top bar. A list of `{ slot, power, level, percent, charging }`: `power` is
        `battery`, `wired` or `unknown`; `level` is `empty`, `low`, `medium`, `full` or null; `percent` is the exact
        charge when Windows says (otherwise null); `charging` is true while it charges. Empty when no controller
        is connected. Checked by the PC every 30 seconds.
      responses:
        "200":
          description: The list.
  /api/theme:
    get:
      summary: The PC's Windows theme
      description: |
        `accent` is the accent colour as `#rrggbb` and `dark` is true when Windows apps use dark mode.
        Read fresh each time. The phone page uses it for its colours and looks again whenever it comes
        back to the foreground; a client may ignore it.
      responses:
        "200":
          description: "`{ accent, dark }`."
  /api/games:
    get:
      summary: The RPCS3 games
      description: |
        `{ available, reason, games: [{ id, title, serial, source }], recent: [id] }`. `source` is `rpcs3` or
        `pcsx2`. `available` is false when neither emulator was found (`reason` says why). A game launch that
        cannot work (for example PCSX2 has no BIOS) is `launch_failed` with a `message` saying why. Ids are opaque; paths never leave the PC.
      responses:
        "200":
          description: The list.
  /api/games/{id}/cover:
    get:
      summary: A game's cover picture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A PNG.
        "404":
          description: Unknown game or no picture (`no_image`).
  /api/games/{id}/background:
    get:
      summary: A game's large background picture
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: A PNG.
        "404":
          description: Unknown game or no picture (`no_image`).
  /api/games/{id}/launch:
    post:
      summary: Start a game
      description: Starts the game in RPCS3. Refused while the kill switch is on.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Started. Returns `{ launched: true, title }`.
        "404":
          description: Unknown id (`unknown_game`).
        "409":
          description: The kill switch is on (`paused`).
        "502":
          description: The game did not start (`launch_failed`).
  /api/pair/local:
    post:
      summary: Pair the PC's own controller-UI window
      description: |
        Only accepted from this PC and only with the one-time key the app gave its own window. Not for
        clients; it exists so the controller UI needs no PIN.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [key]
              properties:
                key:
                  type: string
      responses:
        "200":
          description: Paired; the session cookie is set.
        "401":
          description: Wrong place or wrong key.
  /api/performance:
    get:
      summary: Task-manager numbers
      description: |
        The whole PC and the busiest programs, measured over the time since the previous reading (shared
        between clients, at most once a second). Programs are grouped by name; no process numbers are sent.
      parameters:
        - name: sort
          in: query
          schema:
            type: string
            enum: [cpu, memory, gpu, disk]
          description: Which column orders the programs. Default cpu.
        - name: count
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 1000
          description: How many programs. Default 25; ask for 1000 to get every program.
      responses:
        "200":
          description: |
            `{ cpu, cores, memory: { used, total }, gpu (or null), disk: { percent (or null), readPerSecond,
            writePerSecond }, network: { downPerSecond, upPerSecond }, processes: [{ name, count, cpu, memory,
            gpu (or null), io }] }`. Percentages are 0 to 100, sizes are bytes.
        "400":
          description: Unknown sort (`invalid_sort`).
  /api/dpi:
    get:
      summary: The display scale the toggle controls
      description: |
        Reads the scale fresh each time. `available` is false when the startup self-test failed (for
        example after a Windows update changed the undocumented calls the toggle relies on); `reason`
        then says why. The target monitor is chosen by `dpi.monitor` in the PC's config (default: the
        primary monitor).
      responses:
        "200":
          description: The scale and what the toggle switches between.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiStatus"
        "401":
          description: Missing, unknown or revoked token.
  /api/dpi/toggle:
    post:
      summary: Switch the display scale between its low and high value
      description: |
        Changes the target monitor from the low scale (default 100%) to the high one (default 200%), or
        from anything else back to the low one. The response is sent only after Windows reports the
        new scale. Some apps stay blurry until restarted. Calls while a change is running get 409
        instead of undoing it.
      responses:
        "200":
          description: Changed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DpiChange"
        "401":
          description: Missing, unknown or revoked token.
        "409":
          description: A change is already in progress (`busy`).
        "422":
          description: The monitor does not allow the target scale (`scale_not_supported`). `message` says what its largest scale is.
        "502":
          description: Windows accepted the request but the scale did not change (`dpi_failed`).
        "503":
          description: The toggle is turned off, for example because the self-test failed (`dpi_unavailable`).
  /api/monitors:
    get:
      summary: The PC's monitors, left to right
      description: Needs the `screenshot` feature toggle. The `index` is what the previews and the screenshot take as `monitor`.
      responses:
        "200":
          description: The monitors.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Monitor"
        "401":
          description: Missing, unknown or revoked token.
        "403":
          description: The screenshot feature is switched off (`feature_disabled`).
  /api/screenshot:
    get:
      summary: A picture of one monitor, on demand
      description: |
        A JPEG of the whole monitor. It contains no mouse cursor; `X-Cursor-X` and `X-Cursor-Y` give
        the cursor's position inside the picture (-1 when it is on another monitor) so the client can
        draw a marker. Needs the `screenshot` feature toggle.
      parameters:
        - name: monitor
          in: query
          schema:
            type: integer
            default: -1
          description: Monitor index, or -1 for the monitor the cursor is on.
        - name: width
          in: query
          schema:
            type: integer
            default: 720
            minimum: 160
            maximum: 1920
          description: Width in pixels; the picture is never enlarged beyond the monitor.
      responses:
        "200":
          description: The picture.
          headers:
            X-Cursor-X:
              schema:
                type: integer
            X-Cursor-Y:
              schema:
                type: integer
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        "401":
          description: Missing, unknown or revoked token.
        "403":
          description: The screenshot feature is switched off (`feature_disabled`).
        "503":
          description: The screen cannot be read, for example because the PC is locked (`screen_unavailable`).
security:
  - deviceCookie: []
  - bearer: []
components:
  parameters:
    AppId:
      name: id
      in: path
      required: true
      description: An app id from `GET /api/apps`.
      schema:
        type: string
        pattern: "^[0-9a-f]{16}$"
  securitySchemes:
    deviceCookie:
      type: apiKey
      in: cookie
      name: pc_device
    bearer:
      type: http
      scheme: bearer
  schemas:
    AppList:
      type: object
      required: [apps, recent, launcher]
      properties:
        apps:
          type: array
          items:
            type: object
            required: [id, name, favorite]
            properties:
              id:
                type: string
                description: 16 lower-case hex characters. Opaque; use it only to ask for this app.
                example: 3f9a0c51d2b7e684
              name:
                type: string
              favorite:
                type: boolean
        recent:
          type: array
          description: Ids of recently launched apps that still exist, newest first.
          items:
            type: string
        launcher:
          type: object
          properties:
            powerToysRunShortcut:
              type: string
              example: Shift+Win+Space
            powerToysDetected:
              type: boolean
              description: True when the shortcut was read from PowerToys' own settings.
    DpiStatus:
      type: object
      required: [available, lowPercent, highPercent]
      properties:
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          description: Why the toggle is off, when it is.
        percent:
          type: integer
          nullable: true
          description: The monitor's current scale.
        lowPercent:
          type: integer
          example: 100
        highPercent:
          type: integer
          example: 200
        monitor:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            name:
              type: string
        backend:
          type: string
          nullable: true
          description: Which method read the scale (display-config, effective-dpi or script).
    DpiChange:
      type: object
      required: [previous, percent, note]
      properties:
        previous:
          type: integer
        percent:
          type: integer
        monitor:
          type: object
          nullable: true
          properties:
            index:
              type: integer
            name:
              type: string
        note:
          type: string
          example: Some apps stay blurry until they are restarted.
    Monitor:
      type: object
      required: [index, name, x, y, width, height, primary]
      properties:
        index:
          type: integer
        name:
          type: string
        x:
          type: integer
        y:
          type: integer
        width:
          type: integer
        height:
          type: integer
        primary:
          type: boolean
    Info:
      type: object
      required: [app, protocolVersion, paused]
      properties:
        app:
          type: string
          example: pc-control
        protocolVersion:
          type: integer
          example: 1
        paused:
          type: boolean
          description: True while the tray kill switch is on.
    PairRequest:
      type: object
      required: [pin]
      properties:
        pin:
          type: string
          pattern: "^[0-9]{6}$"
        deviceName:
          type: string
          maxLength: 64
          description: Shown in the tray's device list. Defaults to "Phone".
        issueBearerToken:
          type: boolean
          default: false
          description: Native apps set this to receive the token in the response body.
    Session:
      type: object
      required: [deviceId, deviceName, paused]
      properties:
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        paused:
          type: boolean
        token:
          type: string
          description: Only present in the pairing response, and only when requested.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
